<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - AspirantCafe</title>
  <style>
.password-wrapper {
  position: relative;
  width: 100%;
}

.password-wrapper input {
  width: 100%;
  padding-right: 45px;
}

.toggle-password {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: auto;
  padding: 4px;
  margin: 0;
  border: none;
  background: transparent;
  color: #333;
  font-size: 18px;
  cursor: pointer;
}

.toggle-password:hover {
  background: transparent;
}
</style>
</head>
<body>
  <h1>AspirantCafe</h1>
  <h2>Set New Password</h2>

  <form id="resetPasswordForm">
    <label for="password">New Password</label>
    <div class="password-wrapper">
  <input type="password" id="password" name="password" minlength="14" required>
  <button type="button" class="toggle-password" id="togglePassword">👁️</button>
</div>

    <label for="confirmPassword">Confirm New Password</label>
    <div class="password-wrapper">
  <input type="password" id="confirmPassword" name="confirmPassword" minlength="14" required>
  <button type="button" class="toggle-password" id="toggleConfirmPassword">👁️</button>
</div>

    <button type="submit" id="submitBtn">Reset Password</button>
  </form>

  <div id="message"></div>

  <a href="/admin.html">Back to Login</a>

  <script src="/reset-password.js"></script>
</body>
</html>
