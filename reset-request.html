<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - AspirantCafe</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f9;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 35px 30px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.10);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #1d4ed8;
      margin-bottom: 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
      color: #222;
    }

    .description {
      text-align: center;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #1d4ed8;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #1d4ed8;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      font-size: 14px;
      text-align: center;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .back-login {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #1d4ed8;
      text-decoration: none;
      font-size: 14px;
    }

    .back-login:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">AspirantCafe</div>

    <h2>Reset Password</h2>

    <p class="description">
      Enter your registered email address and we will send you
      instructions to reset your password.
    </p>

    <form id="resetRequestForm">

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your registered email"
        required
        autocomplete="email"
      >

      <button type="submit" id="submitBtn">
        Send Reset Link
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="login.html" class="back-login">
      ← Back to Login
    </a>

  </div>

  <script src="/reset-request.js"></script>

</body>
</html>
